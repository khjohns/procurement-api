steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/artifik-mcp:$COMMIT_SHA
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/artifik-mcp:$COMMIT_SHA

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - artifik-mcp
      - --image=europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/artifik-mcp:$COMMIT_SHA
      - --region=europe-north1
      - --command=python
      - --args=-m,artifik_mcp,--remote
      - --set-secrets=VENDOR_API_ID=vendor-api-id:latest,VENDOR_API_KEY=vendor-api-key:latest,MCP_AUTH_TOKEN=mcp-auth-token:latest,DOFFIN_API_KEY=doffin-api-key:latest
      - --min-instances=0
      - --max-instances=1
      - --memory=256Mi
      - --no-allow-unauthenticated

images:
  - europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/artifik-mcp:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
